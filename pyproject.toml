[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petistat"
version = "0.1.0"
description = "Інфографіка (A4) по підписантах петицій до Кабінету Міністрів України: стать, КАПС, динаміка"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rich>=13"]

[project.scripts]
petistat = "petistat.cli:main"
kmustat = "petistat.kmu_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["petistat"]

[tool.hatch.build.targets.sdist]
include = ["petistat", "README.md", "pyproject.toml"]
